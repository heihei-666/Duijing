# 对镜 · Nginx 配置
#
# 对应方案文档 7.5。两处关键点，改动前请先读注释：
#   1. /api/ 必须关闭 proxy_buffering，否则 SSE 会被缓冲成一次性返回
#   2. 前端 dist 由 Nginx 直接托管，API 才回源到 Uvicorn
#
# 部署位置建议：/etc/nginx/sites-available/duijing
# 启用：ln -s /etc/nginx/sites-available/duijing /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt 校验目录（certbot --nginx 会自动改写本文件加 443）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # ── 证书（certbot 自动续期） ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全响应头 ────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── 前端静态资源 ──────────────────────────────────────
    root /var/www/duijing/dist;
    index index.html;
    client_max_body_size 20m;

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker 绝不能被缓存，否则 PWA 更新会卡住
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html 与 SPA 回退一律不缓存。
    #
    # 它必须每次回源：构建产物的文件名带 hash，HTML 是唯一知道该加载哪个
    # bundle 的地方。一旦 HTML 被缓存，用户就会一直加载旧的 JS。
    # 实测踩过：功能已上线，用户却说「没有任何变化」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ── SSE 专用：必须放在 /api/ 之前 ─────────────────────
    # Nginx 前缀匹配是最长优先，但显式写出来更不容易被后人改坏
    location ~ ^/api/debates/\d+/stream$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ── API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # 复盘卡片生成等 AI 任务可能较慢
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ── 屏蔽杂项探测 ──────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }
}
