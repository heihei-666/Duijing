name: CI

# 这个仓库此前**完全没有 CI** —— 这是几个真实缺陷能长期潜伏的直接原因：
#   · 中文 Windows 上 `pip install -r requirements.txt` 报 UnicodeDecodeError
#   · 中文 Windows 上 test_no_env_blob_in_history 因 cp936 解码失败而挂
#   · deploy/server-setup.sh 的 REPO_URL 在仓库拆分后还指向另一个项目
# 前两个只在**非 UTF-8 的 Windows** 上出现，而之前只在 Ubuntu 容器里跑过测试。
#
# 所以这里的 Windows 作业不是「多此一举」：它是唯一能挡住那类问题的关卡。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（Ubuntu）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑测试
        # 不加 -q：pytest.ini 的 addopts 已经带了 -q，
        # 命令行再来一个会变成 -qq 把汇总行也吞掉。
        run: python -m pytest

  backend-windows:
    name: 后端测试（Windows / 中文编码）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖（这一步曾因 cp936 解码 requirements.txt 而失败）
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑测试（曾因 subprocess 未指定 encoding 而失败）
        run: python -m pytest

  evals:
    name: 评测集规则校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装运行依赖
        # 评测只跑规则层，不需要 pytest，也不需要任何 API Key
        run: pip install -r requirements.txt

      - name: 跑评测（规则层，AI_PROVIDER=mock）
        # 这一层挡的是**硬错误**：schema 不合、观察超上限、输出「你很棒」这类废话、
        # 复盘三块为空。全是确定性的，所以免费、秒级、不会 flaky。
        #
        # 它**不**评价「这条观察准不准」—— 那需要判断力，是 judge 层的活，
        # 要真实模型和 Key，只在本地/服务器手动跑（见 evals/README.md）。
        run: python -m evals.run --mode rules

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（用锁文件，保证可复现）
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      # 上传构建产物，供**无法本地构建**的环境部署。
      #
      # 为什么需要：开发机在受限沙箱里跑不了 vite build（esbuild 要 spawn 子进程，
      # 报 `spawn EPERM`）。没有这一步，每次前端上线都必须由人手在本地构建再上传 ——
      # 既慢又容易漏（构建的 commit 和部署的 commit 对不上时没人会发现）。
      #
      # 有了它：CI 是唯一构建者，谁都能从 Actions 页面下载同一份产物部署。
      #
      # `if-no-files-found: error` 是刻意的：产物缺失时必须让这一步失败。
      # 否则会出现「构建明明成功了但产物是空的」，而部署端要到线上才发现。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14
          if-no-files-found: error

  docker:
    name: 镜像可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只验证能构建出来，不推送。
      # 想拿这份镜像做演示站的话见 README「方式三」——
      # 国内直连 duijing.xyz 会在 TLS 的 SNI 阶段被重置，所以演示站要放境外平台。
      - name: 构建镜像
        run: docker build -t duijing:ci .
